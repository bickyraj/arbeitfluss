spring:
  application:
    name: flowforge-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flowforge}
    username: ${DB_USERNAME:flowforge}
    password: ${DB_PASSWORD:flowforge}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

flowforge:
  webhooks:
    ingress-enabled: ${FLOWFORGE_WEBHOOK_INGRESS_ENABLED:false}
  security:
    admin-token: ${FLOWFORGE_ADMIN_TOKEN:}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
