spring:
  datasource:
    url: jdbc:h2:mem:flowforge-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true

flowforge:
  webhooks:
    ingress-enabled: true
  security:
    admin-token: test-only-flowforge-admin-token-0123456789
