<header class="border-b border-slate-200 bg-white/80 px-4 py-3 backdrop-blur-sm sm:px-6">
  <div class="flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <button
        type="button"
        class="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 text-slate-700 hover:bg-slate-50 md:hidden"
        aria-label="Open navigation"
        (click)="openSidebar()"
      >
        <lucide-icon [img]="menuIcon" class="h-5 w-5" />
      </button>

      <div>
        <p class="text-[11px] font-medium uppercase tracking-[0.18em] text-slate-500">Overview</p>
        <h1 class="mt-0.5 text-lg font-semibold tracking-tight text-slate-900 sm:text-2xl">{{ title() }}</h1>
      </div>
    </div>

    <div class="flex items-center gap-3 sm:gap-4">
      <label class="hidden items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm text-slate-500 md:flex">
        <lucide-icon [img]="searchIcon" class="h-4 w-4" />
        <input
          type="search"
          [value]="searchValue()"
          class="w-52 border-0 bg-transparent text-sm text-slate-700 outline-none placeholder:text-slate-400"
          placeholder="Search workflows"
          (input)="updateSearch($event)"
        />
      </label>

      <button
        type="button"
        class="relative inline-flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 text-slate-700 transition hover:bg-slate-50"
        aria-label="Notifications"
      >
        <lucide-icon [img]="bellIcon" class="h-5 w-5" />
        <span class="absolute -right-0.5 -top-0.5 inline-flex h-5 min-w-5 items-center justify-center rounded-full bg-indigo-600 px-1 text-[10px] font-semibold text-white">3</span>
      </button>

      <div class="relative">
        <button
          type="button"
          class="flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-2 py-1.5 text-left shadow-sm transition hover:bg-slate-50"
          aria-haspopup="menu"
          [attr.aria-expanded]="profileMenuOpen()"
          (click)="toggleMenu()"
        >
          <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-indigo-100 text-sm font-semibold text-indigo-700">
            <lucide-icon [img]="userIcon" class="h-4 w-4" />
          </div>
          <span class="hidden text-sm font-medium text-slate-700 sm:block">Ariana Reed</span>
          <lucide-icon [img]="chevronDownIcon" class="h-4 w-4 text-slate-500" />
        </button>

        @if (profileMenuOpen()) {
          <div class="absolute right-0 z-20 mt-2 w-48 rounded-xl border border-slate-200 bg-white p-2 shadow-lg">
            <button type="button" class="w-full rounded-lg px-3 py-2 text-left text-sm text-slate-700 hover:bg-slate-50">Profile</button>
            <button type="button" class="w-full rounded-lg px-3 py-2 text-left text-sm text-slate-700 hover:bg-slate-50">Preferences</button>
            <button type="button" class="w-full rounded-lg px-3 py-2 text-left text-sm text-slate-700 hover:bg-slate-50">Sign out</button>
          </div>
        }
      </div>
    </div>
  </div>
</header>
